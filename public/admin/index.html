<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Firefly 管理后台</title>
		<link rel="stylesheet" href="/admin/app.css" />
	</head>
	<body>
		<div class="app-shell">
			<aside class="sidebar">
				<header class="brand">
					<div>
						<p class="eyebrow">Firefly Admin</p>
						<h1>文章管理</h1>
					</div>
					<a class="site-link" id="site-link" href="/" target="_blank" rel="noreferrer">查看博客</a>
				</header>

				<form class="auth-panel" id="auth-form">
					<label for="token-input">管理 Token</label>
					<div class="auth-row">
						<input id="token-input" name="token" type="password" autocomplete="current-password" placeholder="输入 ADMIN_TOKEN" />
						<button type="submit">进入</button>
					</div>
					<div class="auth-meta">
						<span id="auth-status">未登录</span>
						<button class="link-button" id="logout-button" type="button">退出</button>
					</div>
				</form>

				<div class="list-tools">
					<button id="new-post-button" type="button">新建文章</button>
					<button class="secondary" id="refresh-button" type="button">刷新</button>
				</div>

				<div class="filters">
					<input id="search-input" type="search" placeholder="搜索标题、分类、标签" />
					<select id="status-filter">
						<option value="all">全部文章</option>
						<option value="published">已发布</option>
						<option value="draft">草稿</option>
					</select>
				</div>

				<div class="post-count" id="post-count">0 篇文章</div>
				<nav class="post-list" id="post-list" aria-label="文章列表"></nav>
			</aside>

			<main class="editor">
				<header class="editor-bar">
					<div>
						<p class="eyebrow" id="current-path">未选择文章</p>
						<h2 id="editor-heading">请选择或新建文章</h2>
					</div>
					<div class="action-row">
						<button class="secondary" id="save-button" type="button">保存</button>
						<button id="draft-button" type="button">存为草稿</button>
						<button class="publish" id="publish-button" type="button">发布</button>
						<button class="danger" id="delete-button" type="button">删除</button>
					</div>
				</header>

				<form class="editor-form" id="post-form">
					<section class="meta-grid">
						<label>
							<span>Slug</span>
							<input id="slug-field" name="slug" placeholder="my-new-post" />
						</label>
						<label>
							<span>标题</span>
							<input id="title-field" name="title" placeholder="文章标题" />
						</label>
						<label>
							<span>发布时间</span>
							<input id="published-field" name="published" type="date" />
						</label>
						<label>
							<span>分类</span>
							<input id="category-field" name="category" placeholder="随笔" />
						</label>
						<label class="wide">
							<span>标签</span>
							<input id="tags-field" name="tags" placeholder="用逗号分隔，例如 Astro, 博客" />
						</label>
						<label class="wide">
							<span>封面图</span>
							<input id="image-field" name="image" placeholder="./images/cover.avif 或 api" />
							<div class="field-actions">
								<input id="cover-upload-input" type="file" accept="image/*" hidden />
								<button class="secondary" id="cover-upload-button" type="button">上传封面图</button>
								<span class="field-help" id="cover-upload-state">支持在线上传，成功后会自动写入封面图地址。</span>
							</div>
						</label>
						<label class="wide">
							<span>摘要</span>
							<textarea id="description-field" name="description" rows="3" placeholder="用于文章列表和 SEO 的摘要"></textarea>
						</label>
					</section>

					<section class="switch-row">
						<label><input id="draft-field" name="draft" type="checkbox" /> 草稿</label>
						<label><input id="pinned-field" name="pinned" type="checkbox" /> 置顶</label>
						<label><input id="comment-field" name="comment" type="checkbox" /> 开启评论</label>
					</section>

					<section class="content-workspace">
						<label class="content-editor">
							<span>Markdown 正文</span>
							<textarea id="body-field" name="body" spellcheck="false" placeholder="在这里写文章正文"></textarea>
						</label>
						<div class="preview-panel">
							<div class="preview-header">
								<span>预览</span>
								<span id="word-count">0 字</span>
							</div>
							<article id="preview-output"></article>
						</div>
					</section>
				</form>
			</main>
		</div>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>
		<script src="/admin/app.js" type="module"></script>
	</body>
</html>
